name: tests
on:
  push:
  pull_request:
jobs:
  # The package targets the 2020 toolchain: Python 3.8, pip 20.3, setuptools 51 and the
  # library versions released by the end of 2020 (pinned in ci/constraints-2020.txt).
  stack-2020-linux:
    runs-on: ubuntu-latest
    container: python:3.8
    steps:
      - uses: actions/checkout@v4
      - run: python -m pip install "pip==20.3.3" "setuptools==51.1.1" "wheel==0.36.2"
      - run: pip install -c ci/constraints-2020.txt -e ".[dev]"
      - run: pytest
      - run: hsp demo ci_demo -n 80

  stack-2020-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.8"
      - run: python -m pip install "pip==20.3.3" "setuptools==51.1.1" "wheel==0.36.2"
      - run: pip install -c ci/constraints-2020.txt -e ".[dev]"
      - run: pytest
      - run: hsp demo ci_demo -n 80

  # Also kept working on current releases.
  current:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: pip install -e ".[dev]"
      - run: pytest
