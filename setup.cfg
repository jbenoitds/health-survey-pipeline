[metadata]
name = health-survey-pipeline
version = attr: hspipe.__version__
description = Config-driven cleaning, validation, scoring and descriptive reporting for REDCap / survey / EMR exports.
long_description = file: README.md
long_description_content_type = text/markdown
author = Jean-Benoit Deville-Stoetzel
license = MIT
license_files = LICENSE
keywords = redcap, survey, data-cleaning, epidemiology, psychometrics, emr, spss
classifiers =
    Programming Language :: Python :: 3
    Programming Language :: Python :: 3.8
    Programming Language :: Python :: 3.9
    Intended Audience :: Science/Research
    Topic :: Scientific/Engineering :: Medical Science Apps.

[options]
package_dir =
    = src
packages = find:
python_requires = >=3.8
include_package_data = True
# Minimum versions are 2020 releases; newer versions (up to pandas 3) are also supported.
install_requires =
    pandas>=1.1
    numpy>=1.19
    scipy>=1.5
    pyyaml>=5.3
    openpyxl>=3.0

[options.packages.find]
where = src

[options.package_data]
hspipe.templates = *.yaml

[options.extras_require]
spss =
    pyreadstat>=1.0
dev =
    pytest>=6.0
    pyreadstat>=1.0

[options.entry_points]
console_scripts =
    hsp = hspipe.cli:main
