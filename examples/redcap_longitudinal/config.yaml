# Demo configuration for the synthetic two-wave wellbeing survey
# (generated by `hsp demo`; every participant is fake).
project:
  name: "Demo Wellbeing Survey (synthetic data)"
  output_dir: output

input:
  data: data/demo_redcap_export.csv
  data_dictionary: data/demo_data_dictionary.csv
  id_column: record_id
  event_column: redcap_event_name

timepoints: [t1, t2]

missing:
  labelled_codes:
    -99: Refused
    -88: Don't know
  variable_codes:
    income: {99: Prefer not to answer}

longitudinal:
  reshape: true
  event_map:
    baseline_arm_1: t1
    followup_arm_1: t2

deidentify:
  drop_free_text: true        # comments fields can hold names / phone numbers
  derive_age:
    - {dob: dob, reference: consent_date, name: age_years}
  hash_id:
    enabled: false

validation:
  duplicates: keep_most_complete
  on_invalid: set_missing
  # custom rules run on the wide (one row per participant) data, so {t} works
  rules:
    - {variable: age_years, range: [18, 50], message: "Age outside eligibility range (18-50)"}
    - {check: "survey_date_{t} >= consent_date", message: "Survey dated before consent"}
    - {variable: "sleep_hours_{t}", outliers: 3.5}

recode:
  - variable: education
    map: {1: 1, 2: 1, 3: 2, 4: 3, 5: 3}
    into: education_3cat
    label: "Education (3 categories)"
    labels: {1: Secondary or less, 2: College / trade, 3: University}
  - variable: bmi
    after_derive: true
    bins: [0, 18.5, 25, 30, .inf]
    labels: [Underweight, Normal, Overweight, Obese]
    into: bmi_cat
    label: "BMI category"

derive:
  - {name: bmi, expr: "weight_kg / (height_cm / 100) ** 2", round: 1, label: "Body mass index (kg/m2)"}
  - {name: n_conditions, type: count_checked, prefix: conditions, exclude: [5], label: "Number of diagnosed conditions"}
  - {name: days_to_followup, type: datediff, start: survey_date_t1, end: survey_date_t2, unit: days,
     label: "Days between baseline and follow-up survey"}

scales:
  - {name: "phq9_{t}", instrument: phq9, items: "phq9_{i}_{t}"}
  - {name: "gad7_{t}", instrument: gad7, items: "gad7_{i}_{t}"}
  - {name: "pss_{t}", instrument: pss10, items: "pss_{i}_{t}"}

describe:
  group_by: group
  continuous: [age_years, bmi, n_conditions, "phq9_{t}", "gad7_{t}", "pss_{t}", "sleep_hours_{t}", "activity_days_{t}"]
  categorical: [sex, education_3cat, income, smoker, bmi_cat, "phq9_{t}_cat", "gad7_{t}_cat", "pss_{t}_cat"]
  variables: []   # [] = only the lists above; "auto" = every numeric/categorical variable

outputs:
  spss: true
